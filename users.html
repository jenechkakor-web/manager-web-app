<!doctype html>
<html class="auth-pending" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пользователи</title>
    <link rel="stylesheet" href="styles.css?v=20260618-auth-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="sidebar" aria-label="Разделы приложения">
          <div class="brand">
            <span class="brand-mark">Д</span>
            <div><strong>Договоры</strong><small>рабочее пространство</small></div>
          </div>
          <nav class="nav-list">
            <a class="nav-item" href="index.html">Создать Договор и Счет.</a>
            <a class="nav-item" href="registry.html">Реестр договоров</a>
            <a class="nav-item hidden" href="library.html" data-admin-only>Справочник</a>
            <a class="nav-item active" href="users.html" data-admin-only>Пользователи</a>
          </nav>
          <div class="sidebar-session">
            <div><strong data-auth-login></strong><small data-auth-role></small></div>
            <button class="button ghost" type="button" data-logout>Выйти</button>
          </div>
        </aside>

        <section class="content">
          <header class="topbar">
            <div><p class="eyebrow">Администрирование</p><h1>Пользователи</h1></div>
            <button class="button ghost" id="reloadUsersButton" type="button">Обновить</button>
          </header>
          <section class="form-area users-content">
            <section class="panel">
              <div class="panel-title"><h2>Новый пользователь</h2></div>
              <form id="createUserForm" class="user-create-grid" autocomplete="off">
                <label>
                  <span>Логин</span>
                  <input id="newUserLogin" name="new-account-login" autocomplete="off" minlength="3" maxlength="64" data-1p-ignore data-lpignore="true" required />
                </label>
                <label>
                  <span>Пароль</span>
                  <input id="newUserPassword" name="new-account-password" type="password" autocomplete="new-password" minlength="8" data-1p-ignore data-lpignore="true" required />
                </label>
                <label>
                  <span>Права</span>
                  <select id="newUserRole">
                    <option value="user">Пользователь</option>
                    <option value="admin">Администратор</option>
                  </select>
                </label>
                <button class="button primary" id="createUserButton" type="submit">Создать</button>
              </form>
              <p class="status-line" id="usersStatus" role="status" aria-live="polite"></p>
            </section>

            <section class="panel">
              <div class="panel-title"><h2>Список пользователей</h2></div>
              <div class="users-list" id="usersList"></div>
            </section>
          </section>
        </section>
      </section>
    </main>
    <script src="auth.js?v=20260618-auth-1"></script>
    <script src="users.js?v=20260619-passwords-1"></script>
  </body>
</html>
