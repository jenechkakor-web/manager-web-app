<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход · Договоры менеджера</title>
    <link rel="stylesheet" href="styles.css?v=20260618-auth-1" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="brand login-brand">
          <span class="brand-mark">Д</span>
          <div>
            <strong>Договоры</strong>
            <small>рабочее пространство</small>
          </div>
        </div>
        <div>
          <p class="eyebrow">Авторизация</p>
          <h1>Вход в систему</h1>
          <p class="login-hint">Введите логин и пароль, выданные администратором.</p>
        </div>
        <form id="loginForm" class="login-form">
          <label>
            <span>Логин</span>
            <input id="loginInput" autocomplete="username" autofocus required />
          </label>
          <label>
            <span>Пароль</span>
            <input id="passwordInput" type="password" autocomplete="current-password" required />
          </label>
          <p class="status-line login-status" id="loginStatus" aria-live="polite"></p>
          <button class="button primary" id="loginButton" type="submit">Войти</button>
        </form>
      </section>
    </main>
    <script src="login.js?v=20260618-auth-1"></script>
  </body>
</html>
