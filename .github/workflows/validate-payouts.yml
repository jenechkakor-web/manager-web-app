name: Validate payouts
on:
  workflow_call:
  push:
    branches: ["codex/payouts-release", "codex/bitrix-integration"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        php: ['5.6', '8.1']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-only
          MYSQL_DATABASE: manager_payout_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and local API tests
        run: |
          php -l api/index.php
          php -l api/payouts.php
          php -l api/bitrix.php
          php tests/bitrix-php.php
          node --check payouts.js
          node --check payouts-table.js
          node --check app.js
          node --check registry.js
          node --check registry-storage-sync.js
          node --check users.js
          node --test tests/payouts.test.cjs tests/bitrix.test.cjs tests/proposal.test.cjs
      - name: PHP MySQL migration and API tests on disposable database
        env:
          PAYOUT_TEST_MYSQL: '1'
        run: |
          php tests/payouts-php.php
          node tests/payouts-php-http.cjs
          php tests/bitrix-php.php
