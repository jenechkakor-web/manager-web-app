name: Deploy to Beget

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-beget.yml"
      - ".htaccess"
      - "*.html"
      - "*.js"
      - "*.css"
      - "dogovor_final.docx"
      - "invoice_template.docx"
      - "schet_dogovor_template.docx"
      - "schet_dogovor_zamery_template.docx"
      - "assets/**"
      - "api/**"
      - "templates/tech-presets.json"

permissions:
  contents: read

concurrency:
  group: deploy-beget-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.BEGET_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.BEGET_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
      DADATA_API_TOKEN: ${{ secrets.DADATA_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare public files
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-api deploy-public
          cp api/.htaccess api/config.php api/config.local.example.php api/dadata-client.php api/dadata.local.example.php api/index.php deploy-api/
          printf "<?php\n\nreturn ['dadata_token' => '%s'];\n" "$DADATA_API_TOKEN" > deploy-api/dadata.local.php

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_api=true
            files=(
              .htaccess
              index.html login.html registry.html library.html users.html
              app.js auth.js login.js registry-storage-sync.js registry.js library.js users.js styles.css
              dogovor_final.docx invoice_template.docx
              schet_dogovor_template.docx schet_dogovor_zamery_template.docx
              templates/tech-presets.json templates/contracts-registry.json
            )
            while IFS= read -r asset; do
              files+=("$asset")
            done < <(find assets -type f -print)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" "${{ github.sha }}")
            upload_api=false
            for file in "${files[@]}"; do
              case "$file" in
                api/*)
                  upload_api=true
                  ;;
              esac
            done
            files+=(
              ".htaccess"
              "index.html"
              "login.html"
              "registry.html"
              "library.html"
              "users.html"
              "app.js"
              "auth.js"
              "login.js"
              "registry-storage-sync.js"
              "registry.js"
              "library.js"
              "users.js"
              "styles.css"
              "assets/ip-signature.png"
              "assets/ip-stamp.png"
              "assets/ooo-signature.png"
              "assets/ooo-stamp.png"
            )
          fi

          upload_public=false
          for file in "${files[@]}"; do
            case "$file" in
              server.js)
                continue
                ;;
              .htaccess|*.html|*.js|*.css|*.docx|assets/*|templates/tech-presets.json|templates/contracts-registry.json)
                if [[ -f "$file" ]]; then
                  if [[ "$file" == "assets/ip-signature.png" ]]; then
                    continue
                  fi
                  mkdir -p "deploy-public/$(dirname "$file")"
                  cp "$file" "deploy-public/$file"
                  upload_public=true
                fi
                ;;
            esac
          done
          echo "upload_api=$upload_api" >> "$GITHUB_OUTPUT"
          echo "upload_public=$upload_public" >> "$GITHUB_OUTPUT"

      - name: Validate FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          if [[ "${{ steps.prepare.outputs.upload_api }}" == "true" ]]; then
            test -n "$DADATA_API_TOKEN"
          fi

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Back up current production files
        shell: bash
        run: |
          set -euo pipefail
          backup_complete=false
          for attempt in 1 2 3; do
            rm -rf backup-live
            mkdir -p backup-live backup-live/assets backup-live/api backup-live/templates
            if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP_COMMANDS'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 6
          set net:timeout 20
          set net:reconnect-interval-base 5
          set cmd:fail-exit true
          get /.htaccess -o backup-live/.htaccess
          get /index.html -o backup-live/index.html
          get /login.html -o backup-live/login.html
          get /registry.html -o backup-live/registry.html
          get /library.html -o backup-live/library.html
          get /users.html -o backup-live/users.html
          get /app.js -o backup-live/app.js
          get /auth.js -o backup-live/auth.js
          get /login.js -o backup-live/login.js
          get /registry-storage-sync.js -o backup-live/registry-storage-sync.js
          set cmd:fail-exit false
          get /registry.js -o backup-live/registry.js
          get /styles.css -o backup-live/styles.css
          set cmd:fail-exit true
          get /library.js -o backup-live/library.js
          get /users.js -o backup-live/users.js
          get /dogovor_final.docx -o backup-live/dogovor_final.docx
          get /invoice_template.docx -o backup-live/invoice_template.docx
          get /schet_dogovor_template.docx -o backup-live/schet_dogovor_template.docx
          get /schet_dogovor_zamery_template.docx -o backup-live/schet_dogovor_zamery_template.docx
          mirror --verbose --parallel=1 /assets backup-live/assets
          mirror --verbose --parallel=1 --exclude-glob config.local.php --exclude-glob dadata.local.php /api backup-live/api
          mirror --verbose --parallel=1 /templates backup-live/templates
          bye
          LFTP_COMMANDS
            then
              backup_complete=true
              break
            fi
            echo "Production backup failed on attempt $attempt. Retrying..."
            sleep 10
          done
          test "$backup_complete" = true
          find backup-live -type f -print0 | sort -z | xargs -0 sha256sum > backup-live/SHA256SUMS.txt

      - name: Store production backup
        uses: actions/upload-artifact@v4
        with:
          name: manager-live-before-${{ github.run_id }}
          path: backup-live/
          if-no-files-found: error
          retention-days: 30

      - name: Restore critical registry files first
        if: steps.prepare.outputs.upload_public == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upload_ftp() {
            local source="$1"
            local destination="${2#/}"
            curl --fail --show-error --silent --ftp-ssl-control \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --ftp-create-dirs --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --upload-file "$source" "ftp://$FTP_SERVER/$destination"
          }
          upload_ftp deploy-public/registry.html /registry.html
          upload_ftp deploy-public/registry.js /registry.js
          upload_ftp deploy-public/styles.css /styles.css

      - name: Upload core API to Beget
        if: steps.prepare.outputs.upload_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upload_core_file() {
            local source="$1"
            local destination="${2#/}"
            curl --fail --show-error --silent --ftp-ssl-control \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --ftp-create-dirs --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --upload-file "$source" "ftp://$FTP_SERVER/$destination"
          }

          upload_core_file deploy-api/index.php /api/index.php
          upload_core_file deploy-api/.htaccess /api/.htaccess
          upload_core_file deploy-api/config.php /api/config.php
          upload_core_file deploy-api/config.local.example.php /api/config.local.example.php

      - name: Verify API deployment
        if: steps.prepare.outputs.upload_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            response="$(curl --fail --silent --show-error --max-time 20 https://manager.verkup.ru/api/health || true)"
            if grep -q '"database":true' <<<"$response"; then
              echo "API health check passed."
              exit 0
            fi

            echo "API health check failed on attempt $attempt; uploading API again."
            for source in deploy-api/.htaccess deploy-api/index.php deploy-api/config.php; do
              destination="api/$(basename "$source")"
              curl --fail --show-error --silent --ftp-ssl-control \
                --user "$FTP_USERNAME:$FTP_PASSWORD" \
                --ftp-create-dirs --connect-timeout 15 --max-time 90 \
                --retry 2 --retry-delay 5 --retry-all-errors \
                --upload-file "$source" "ftp://$FTP_SERVER/$destination"
            done
            sleep 10
          done

          echo "API health check failed after all retries."
          exit 1

      - name: Upload DaData server configuration
        if: steps.prepare.outputs.upload_api == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          upload_ftp() {
            local source="$1"
            local destination="${2#/}"
            curl --fail --show-error --silent --ftp-ssl-control \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --ftp-create-dirs --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --upload-file "$source" "ftp://$FTP_SERVER/$destination"
          }
          upload_ftp deploy-api/dadata-client.php /api/dadata-client.php
          upload_ftp deploy-api/dadata.local.php /api/dadata.local.php
          upload_ftp deploy-api/dadata.local.example.php /api/dadata.local.example.php

      - name: Upload public files to Beget
        if: steps.prepare.outputs.upload_public == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            destination="${source#deploy-public/}"
            curl --fail --show-error --silent --ftp-ssl-control \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --ftp-create-dirs --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --upload-file "$source" "ftp://$FTP_SERVER/$destination"
          done < <(find deploy-public -type f -print0)

      - name: Verify signature and stamp assets
        if: steps.prepare.outputs.upload_public == 'true'
        shell: bash
        run: |
          set -euo pipefail
          verify_asset() {
            local relative="$1"
            local source="deploy-public/$relative"
            local downloaded
            downloaded="$(mktemp)"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "https://manager.verkup.ru/$relative" -o "$downloaded" \
                && cmp --silent "$source" "$downloaded"; then
                echo "Verified $relative."
                rm -f "$downloaded"
                return 0
              fi
              echo "Verification of $relative failed on attempt $attempt. Retrying..."
              sleep 5
            done
            rm -f "$downloaded"
            return 1
          }

          verify_ip_signature() {
            local source="assets/ip-signature.png"
            local downloaded
            downloaded="$(mktemp)"
            if curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              'https://manager.verkup.ru/assets/ip-signature.png' \
              -o "$downloaded" \
              && cmp --silent "$source" "$downloaded"; then
              echo "Verified hosting copy of assets/ip-signature.png."
              rm -f "$downloaded"
              return 0
            fi
            if curl --fail --silent --show-error --max-time 20 \
              'https://raw.githubusercontent.com/jenechkakor-web/manager-web-app/main/assets/ip-signature.png' \
              -o "$downloaded" \
              && cmp --silent "$source" "$downloaded"; then
              echo "Verified repository fallback for assets/ip-signature.png."
              rm -f "$downloaded"
              return 0
            fi
            rm -f "$downloaded"
            return 1
          }

          verify_ip_signature
          for relative in \
            assets/ip-stamp.png \
            assets/ooo-signature.png \
            assets/ooo-stamp.png; do
            verify_asset "$relative"
          done
