name: Deploy to Beget

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-beget.yml"
      - ".htaccess"
      - "*.html"
      - "*.js"
      - "*.css"
      - "dogovor_final.docx"
      - "invoice_template.docx"
      - "schet_dogovor_template.docx"
      - "schet_dogovor_zamery_template.docx"
      - "assets/**"
      - "api/**"
      - "templates/tech-presets.json"

permissions:
  contents: read

concurrency:
  group: deploy-beget-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.BEGET_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.BEGET_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
      DADATA_API_TOKEN: ${{ secrets.DADATA_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare public files
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-api deploy-public
          cp api/.htaccess api/config.php api/config.local.example.php api/dadata-client.php api/dadata.local.example.php api/index.php deploy-api/
          printf "<?php\n\nreturn ['dadata_token' => '%s'];\n" "$DADATA_API_TOKEN" > deploy-api/dadata.local.php

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_api=true
            files=(
              .htaccess
              index.html login.html registry.html library.html users.html
              app.js auth.js login.js registry-storage-sync.js registry.js library.js users.js styles.css
              dogovor_final.docx invoice_template.docx
              schet_dogovor_template.docx schet_dogovor_zamery_template.docx
              templates/tech-presets.json templates/contracts-registry.json
            )
            while IFS= read -r asset; do
              files+=("$asset")
            done < <(find assets -type f -print)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" "${{ github.sha }}")
            upload_api=false
            for file in "${files[@]}"; do
              case "$file" in
                api/*)
                  upload_api=true
                  ;;
              esac
            done
            files+=(
              "index.html"
              "app.js"
              "registry.html"
              "registry-storage-sync.js"
              "registry.js"
              "styles.css"
              "assets/ip-signature.png"
              "assets/ip-stamp.png"
              "assets/ooo-signature.png"
              "assets/ooo-stamp.png"
            )
          fi

          upload_public=false
          for file in "${files[@]}"; do
            case "$file" in
              .htaccess|*.html|*.js|*.css|*.docx|assets/*|templates/tech-presets.json|templates/contracts-registry.json)
                if [[ -f "$file" ]]; then
                  mkdir -p "deploy-public/$(dirname "$file")"
                  cp "$file" "deploy-public/$file"
                  upload_public=true
                fi
                ;;
            esac
          done
          echo "upload_api=$upload_api" >> "$GITHUB_OUTPUT"
          echo "upload_public=$upload_public" >> "$GITHUB_OUTPUT"

      - name: Validate FTP secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          if [[ "${{ steps.prepare.outputs.upload_api }}" == "true" ]]; then
            test -n "$DADATA_API_TOKEN"
          fi

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Upload core API to Beget
        if: steps.prepare.outputs.upload_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upload_core_file() {
            local source="$1"
            local destination="$2"
            for attempt in 1 2 3; do
              if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ssl:verify-certificate true;
                set net:max-retries 6;
                set net:timeout 20;
                set net:reconnect-interval-base 5;
                set xfer:clobber true;
                set cmd:fail-exit true;
                put $source -o $destination.uploading;
                mv $destination.uploading $destination;
                bye;
              "; then
                return 0
              fi
              echo "Upload of $source failed on attempt $attempt. Retrying..."
              sleep 10
            done
            return 1
          }

          upload_core_file deploy-api/index.php /api/index.php
          upload_core_file deploy-api/.htaccess /api/.htaccess
          upload_core_file deploy-api/config.php /api/config.php
          upload_core_file deploy-api/config.local.example.php /api/config.local.example.php

      - name: Verify API deployment
        if: steps.prepare.outputs.upload_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            response="$(curl --fail --silent --show-error --max-time 20 https://manager.verkup.ru/api/health || true)"
            if grep -q '"database":true' <<<"$response"; then
              echo "API health check passed."
              exit 0
            fi

            echo "API health check failed on attempt $attempt; uploading API again."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate true;
              set net:max-retries 6;
              set net:timeout 20;
              set net:reconnect-interval-base 5;
              set xfer:clobber true;
              set cmd:fail-exit true;
              put deploy-api/.htaccess -o /api/.htaccess;
              put deploy-api/index.php -o /api/index.php;
              put deploy-api/config.php -o /api/config.php;
              bye;
            "
            sleep 10
          done

          echo "API health check failed after all retries."
          exit 1

      - name: Upload DaData server configuration
        if: steps.prepare.outputs.upload_api == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP_COMMANDS'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 6
          set net:timeout 20
          set net:reconnect-interval-base 5
          set xfer:clobber true
          set cmd:fail-exit true
          put deploy-api/dadata-client.php -o /api/dadata-client.php
          put deploy-api/dadata.local.php -o /api/dadata.local.php
          put deploy-api/dadata.local.example.php -o /api/dadata.local.example.php
          bye
          LFTP_COMMANDS

      - name: Upload public files to Beget
        if: steps.prepare.outputs.upload_public == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upload_public_file() {
            local source="$1"
            local relative="${source#deploy-public/}"
            local destination="/$relative"
            local destination_dir
            local mkdir_command=""
            destination_dir="$(dirname "$destination")"
            if [[ "$destination_dir" != "/" ]]; then
              mkdir_command="mkdir -p \"$destination_dir\";"
            fi

            for attempt in 1 2 3; do
              if lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ssl:verify-certificate true;
                set net:max-retries 6;
                set net:timeout 20;
                set net:reconnect-interval-base 5;
                set xfer:clobber true;
                set cmd:fail-exit true;
                $mkdir_command
                put \"$source\" -o \"$destination.uploading\";
                mv \"$destination.uploading\" \"$destination\";
                bye;
              "; then
                echo "Uploaded $relative."
                return 0
              fi
              echo "Upload of $relative failed on attempt $attempt. Retrying..."
              sleep 10
            done
            return 1
          }

          while IFS= read -r -d '' source; do
            upload_public_file "$source"
          done < <(find deploy-public -type f -print0 | sort -z)

      - name: Verify signature and stamp assets
        if: steps.prepare.outputs.upload_public == 'true'
        shell: bash
        run: |
          set -euo pipefail
          verify_asset() {
            local relative="$1"
            local source="deploy-public/$relative"
            local downloaded
            downloaded="$(mktemp)"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "https://manager.verkup.ru/$relative" -o "$downloaded" \
                && cmp --silent "$source" "$downloaded"; then
                echo "Verified $relative."
                rm -f "$downloaded"
                return 0
              fi
              echo "Verification of $relative failed on attempt $attempt. Retrying..."
              sleep 5
            done
            rm -f "$downloaded"
            return 1
          }

          for relative in \
            assets/ip-signature.png \
            assets/ip-stamp.png \
            assets/ooo-signature.png \
            assets/ooo-stamp.png; do
            verify_asset "$relative"
          done
