<!doctype html>
<html class="auth-pending" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Реестр договоров</title>
    <link rel="stylesheet" href="styles.css?v=20260702-registry-6" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="sidebar" aria-label="Разделы приложения">
          <div class="brand">
            <span class="brand-mark">Д</span>
            <div><strong>Договоры</strong><small>рабочее пространство</small></div>
          </div>
          <nav class="nav-list">
            <a class="nav-item" href="index.html">Создать Договор и Счет</a>
            <a class="nav-item active" href="registry.html">Реестр договоров</a>
            <a class="nav-item hidden" href="library.html" data-admin-only>Справочник</a>
            <a class="nav-item hidden" href="users.html" data-admin-only>Пользователи</a>
          </nav>
          <div class="sidebar-session">
            <div><strong data-auth-login></strong><small data-auth-role></small></div>
            <button class="button ghost" type="button" data-logout>Выйти</button>
          </div>
        </aside>

        <section class="content">
          <header class="topbar">
            <div><p class="eyebrow">Реестр</p><h1>Договоры</h1></div>
            <button class="button ghost" id="reloadRegistryButton" type="button">Обновить</button>
          </header>
          <section class="form-area library-content">
            <section class="panel">
              <div class="registry-toolbar">
                <label>
                  <span>Поиск по номеру или контрагенту</span>
                  <input id="registrySearchInput" placeholder="Введите номер или название" />
                </label>
              </div>
              <div class="registry-filters" aria-label="Фильтры реестра">
                <div class="registry-date-filter" id="registryDateFilter">
                  <label for="registryMonthFilter">Месяц</label>
                  <div class="registry-month-row">
                    <select id="registryMonthFilter"><option value="">Все месяцы</option></select>
                    <button class="button ghost registry-period-toggle" id="registryPeriodToggle" type="button" aria-expanded="false" aria-controls="registryPeriodPanel">Период</button>
                  </div>
                  <div class="registry-period-panel hidden" id="registryPeriodPanel">
                    <label>
                      <span>Дата с</span>
                      <input id="registryDateFrom" type="date" />
                    </label>
                    <label>
                      <span>Дата по</span>
                      <input id="registryDateTo" type="date" />
                    </label>
                    <p class="registry-period-error" id="registryPeriodError" role="alert"></p>
                    <div class="registry-period-actions">
                      <button class="button primary" id="registryPeriodApply" type="button">Применить</button>
                      <button class="button ghost" id="registryPeriodReset" type="button">Сбросить</button>
                    </div>
                  </div>
                </div>
                <label>
                  <span>Источник</span>
                  <select id="registrySourceFilter"><option value="">Все источники</option></select>
                </label>
                <label>
                  <span>Оплачен</span>
                  <select id="registryPaymentStatusFilter"><option value="">Все варианты</option></select>
                </label>
                <label>
                  <span>Вид оплаты</span>
                  <select id="registryPaymentTypeFilter"><option value="">Все варианты</option></select>
                </label>
                <label>
                  <span>Закрывашки</span>
                  <select id="registryClosingDocsFilter"><option value="">Все варианты</option></select>
                </label>
                <label class="hidden" data-admin-only>
                  <span>Менеджер</span>
                  <select id="registryManagerFilter"><option value="">Все менеджеры</option></select>
                </label>
              </div>
              <p class="status-line" id="registryStatus"></p>
              <div class="registry-table-wrap">
                <table class="registry-table">
                  <thead>
                    <tr>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="number" type="button">Номер<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="date" type="button">Дата<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="counterparty" type="button">Контрагент<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="amount" type="button">Сумма<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="source" type="button">Источник<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="paymentStatus" type="button">Оплачен<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="prepayment" type="button">Предоплата<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="remainder" type="button">Остаток<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="paymentType" type="button">Вид оплаты<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="closingDocs" type="button">Закрывашки<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="dealStatus" type="button">Статус сделки<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="bonusType" type="button">Тип бонуса<span aria-hidden="true">↕</span></button></th>
                      <th scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="bonusAmount" type="button">Сумма бонуса<span aria-hidden="true">↕</span></button></th>
                      <th class="hidden" data-admin-only scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="recordStatus" type="button">Статус<span aria-hidden="true">↕</span></button></th>
                      <th class="hidden" data-admin-only scope="col" aria-sort="none"><button class="registry-sort-button" data-sort-field="manager" type="button">Менеджер<span aria-hidden="true">↕</span></button></th>
                      <th class="hidden" data-admin-only scope="col">Удаление</th>
                    </tr>
                  </thead>
                  <tbody id="registryTableBody"></tbody>
                </table>
                <div class="registry-empty hidden" id="registryEmpty">В реестре пока нет договоров.</div>
              </div>
              <section class="registry-summary" aria-label="Свод по суммам">
                <div class="registry-summary-header">
                  <h2>Свод по выбранным договорам</h2>
                  <span id="registrySummaryCount">В выборке: 0</span>
                </div>
                <div class="registry-summary-grid" id="registrySummary"></div>
              </section>
            </section>
          </section>
        </section>
      </section>
    </main>
    <script src="auth.js?v=20260618-auth-1"></script>
    <script src="registry-storage-sync.js?v=20260630-registry-1"></script>
    <script src="registry.js?v=20260702-registry-7"></script>
  </body>
</html>
