<!doctype html>
<html class="auth-pending" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Реестр договоров</title>
    <link rel="stylesheet" href="styles.css?v=20260630-registry-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="sidebar" aria-label="Разделы приложения">
          <div class="brand">
            <span class="brand-mark">Д</span>
            <div><strong>Договоры</strong><small>рабочее пространство</small></div>
          </div>
          <nav class="nav-list">
            <a class="nav-item" href="index.html">Создать Договор и Счет</a>
            <a class="nav-item active" href="registry.html">Реестр договоров</a>
            <a class="nav-item hidden" href="library.html" data-admin-only>Справочник</a>
            <a class="nav-item hidden" href="users.html" data-admin-only>Пользователи</a>
          </nav>
          <div class="sidebar-session">
            <div><strong data-auth-login></strong><small data-auth-role></small></div>
            <button class="button ghost" type="button" data-logout>Выйти</button>
          </div>
        </aside>

        <section class="content">
          <header class="topbar">
            <div><p class="eyebrow">Реестр</p><h1>Договоры</h1></div>
            <button class="button ghost" id="reloadRegistryButton" type="button">Обновить</button>
          </header>
          <section class="form-area library-content">
            <section class="panel">
              <div class="registry-toolbar">
                <label>
                  <span>Поиск по номеру или контрагенту</span>
                  <input id="registrySearchInput" placeholder="Введите номер или название" />
                </label>
              </div>
              <p class="status-line" id="registryStatus"></p>
              <div class="registry-table-wrap">
                <table class="registry-table">
                  <thead>
                    <tr>
                      <th>Номер</th>
                      <th>Дата</th>
                      <th>Контрагент</th>
                      <th>Сумма</th>
                      <th>Источник</th>
                      <th>Оплачен</th>
                      <th>Предоплата</th>
                      <th>Остаток</th>
                      <th>Вид оплаты</th>
                      <th>Закрывашки</th>
                      <th>Тип бонуса</th>
                      <th>Сумма бонуса</th>
                      <th>Статус</th>
                      <th class="hidden" data-admin-only>Менеджер</th>
                      <th class="hidden" data-admin-only>Удаление</th>
                    </tr>
                  </thead>
                  <tbody id="registryTableBody"></tbody>
                </table>
                <div class="registry-empty hidden" id="registryEmpty">В реестре пока нет договоров.</div>
              </div>
            </section>
          </section>
        </section>
      </section>
    </main>
    <script src="auth.js?v=20260618-auth-1"></script>
    <script src="registry-storage-sync.js?v=20260630-registry-1"></script>
    <script src="registry.js?v=20260630-registry-1"></script>
  </body>
</html>
