<!doctype html>
<html class="auth-pending" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Справочник тех. описаний</title>
    <link rel="stylesheet" href="styles.css?v=20260618-auth-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="sidebar" aria-label="Разделы приложения">
          <div class="brand">
            <span class="brand-mark">Д</span>
            <div><strong>Договоры</strong><small>рабочее пространство</small></div>
          </div>
          <nav class="nav-list">
            <a class="nav-item" href="index.html">Создать Договор и Счет.</a>
            <a class="nav-item" href="registry.html">Реестр договоров</a>
            <a class="nav-item active hidden" href="library.html" data-admin-only>Справочник</a>
            <a class="nav-item hidden" href="users.html" data-admin-only>Пользователи</a>
          </nav>
          <div class="sidebar-session">
            <div><strong data-auth-login></strong><small data-auth-role></small></div>
            <button class="button ghost" type="button" data-logout>Выйти</button>
          </div>
        </aside>

        <section class="content">
          <header class="topbar">
            <div><p class="eyebrow">Справочник</p><h1>Технические описания</h1></div>
            <div class="row-actions">
              <button class="button ghost" id="reloadLibraryButton" type="button">Обновить</button>
              <button class="button primary hidden" id="saveLibraryButton" type="button" data-admin-only>Сохранить</button>
            </div>
          </header>
          <section class="form-area library-content">
            <section class="panel" id="libraryEditorPanel">
              <div class="library-toolbar">
                <label>
                  <span>Фильтр по группе</span>
                  <select id="libraryGroupFilter"></select>
                </label>
                <label>
                  <span>Фильтр по подгруппе</span>
                  <select id="librarySubgroupFilter"></select>
                </label>
                <button class="button ghost hidden" id="addLibraryPresetButton" type="button" data-admin-only>Добавить шаблон</button>
              </div>
              <p class="status-line" id="libraryStatus"></p>
              <div class="library-list" id="libraryPresetList"></div>
            </section>
          </section>
        </section>
      </section>
    </main>
    <script src="auth.js?v=20260618-auth-1"></script>
    <script src="library.js?v=20260618-auth-1"></script>
  </body>
</html>
